<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои расходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --card: #1a1a1a;
    --accent: #e0e0e0;
    --accent-light: #2a2a2a;
    --accent2: #10b981;
    --accent2-light: #0d2b22;
    --danger: #ef4444;
    --danger-light: #2a1010;
    --text: #f0f0f0;
    --muted: #888888;
    --border: #2e2e2e;
    --shadow: 0 2px 16px rgba(0,0,0,0.5);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* ── Шапка ── */
  .header {
    background: #111111;
    border-bottom: 1px solid #2e2e2e;
    padding: 20px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 0; right: 0;
    height: 40px;
    background: var(--bg);
    border-radius: 50% 50% 0 0 / 40px 40px 0 0;
  }
  .header-title {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-total {
    color: #ffffff;
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
  }
  .header-sub {
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    margin-top: 4px;
  }

  /* ── Вкладки ── */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 16px 16px 8px;
  }
  .tab {
    flex: 1;
    background: var(--card);
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 4px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: #10b981;
    color: #fff;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
  }

  /* ── Секции ── */
  .section { display: none; padding: 0 16px; }
  .section.active { display: block; }

  /* ── Карточки расходов ── */
  .expense-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .expense-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .expense-info { flex: 1; min-width: 0; }
  .expense-cat {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .expense-meta {
    font-size: 12px; color: var(--muted); margin-top: 2px;
  }
  .expense-amount {
    font-size: 17px; font-weight: 800;
    color: #10b981;
    white-space: nowrap;
  }
  .delete-btn {
    background: var(--danger-light);
    border: none;
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .delete-btn:hover { background: #fca5a5; }

  /* ── Форма добавления ── */
  .add-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .add-card h3 {
    font-size: 16px; font-weight: 800;
    margin-bottom: 16px; color: var(--text);
  }
  .amount-input-wrap {
    position: relative; margin-bottom: 16px;
  }
  .amount-prefix {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 18px; font-weight: 800; color: #10b981;
  }
  .amount-input {
    width: 100%;
    padding: 14px 16px 14px 48px;
    font-family: 'Nunito', sans-serif;
    font-size: 24px; font-weight: 800;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }
  .amount-input:focus { border-color: #10b981; }
  .amount-input::placeholder { color: var(--border); }

  .note-input {
    width: 100%;
    padding: 12px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--bg);
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .note-input:focus { border-color: #10b981; }

  .cats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .cat-btn {
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 10px 4px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Nunito', sans-serif;
  }
  .cat-btn span:first-child { font-size: 22px; }
  .cat-btn span:last-child { font-size: 10px; font-weight: 700; color: var(--muted); }
  .cat-btn.selected {
    background: #0d2b22;
    border-color: #10b981;
  }
  .cat-btn.selected span:last-child { color: #10b981; }

  .submit-btn {
    width: 100%;
    background: #10b981;
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 15px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(16,185,129,0.3);
  }
  .submit-btn:active { transform: scale(0.98); }

  /* ── Статистика ── */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 800; color: #10b981; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .cat-stat-item {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .cat-stat-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .cat-stat-name { flex: 1; font-size: 14px; font-weight: 700; }
  .cat-stat-amt { font-size: 15px; font-weight: 800; color: #10b981; }
  .progress-bar {
    height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: width 0.5s ease;
  }

  /* ── Пустое состояние ── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 15px; font-weight: 600; }

  /* ── Нижняя навигация ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 16px 20px;
    gap: 8px;
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 8px 4px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    font-family: 'Nunito', sans-serif;
  }
  .nav-btn span:first-child { font-size: 22px; }
  .nav-btn span:last-child { font-size: 11px; font-weight: 700; color: var(--muted); }
  .nav-btn.active { background: #1a2e25; }
  .nav-btn.active span:last-child { color: #10b981; }

  .clear-btn {
    width: 100%;
    background: var(--danger-light);
    color: var(--danger);
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 800;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .clear-btn:hover { background: #fca5a5; }

  .period-label {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin: 0 0 10px;
  }
</style>
</head>
<body>

<!-- Шапка -->
<div class="header">
  <div class="header-title">Расходы за месяц</div>
  <div class="header-total" id="header-total">0 ₽</div>
  <div class="header-sub" id="header-sub">0 записей</div>
</div>

<!-- Вкладки -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('history')">📋 История</button>
  <button class="tab" onclick="switchTab('add')">➕ Добавить</button>
  <button class="tab" onclick="switchTab('stats')">📊 Статистика</button>
</div>

<!-- История -->
<div class="section active" id="tab-history">
  <p class="period-label" id="history-period">Все записи</p>
  <div id="expense-list"></div>
</div>

<!-- Добавить -->
<div class="section" id="tab-add">
  <div class="add-card">
    <h3>Новый расход</h3>
    <div class="amount-input-wrap">
      <span class="amount-prefix">Br</span>
      <input class="amount-input" id="amount-input" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
    </div>
    <div class="cats-grid" id="cats-grid"></div>
    <input class="note-input" id="note-input" type="text" placeholder="Комментарий (необязательно)">
    <button class="submit-btn" onclick="submitExpense()">Сохранить расход</button>
  </div>
</div>

<!-- Статистика -->
<div class="section" id="tab-stats">
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">За месяц</div>
      <div class="stat-value" id="stat-month">0 ₽</div>
      <div class="stat-sub" id="stat-month-count">0 записей</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">За сегодня</div>
      <div class="stat-value" id="stat-today">0 ₽</div>
      <div class="stat-sub" id="stat-today-count">0 записей</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Всего потрачено</div>
      <div class="stat-value" id="stat-total">0 ₽</div>
      <div class="stat-sub" id="stat-total-count">0 записей</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Средний расход</div>
      <div class="stat-value" id="stat-avg">0 ₽</div>
      <div class="stat-sub">за запись</div>
    </div>
  </div>
  <p class="period-label">По категориям</p>
  <div id="cat-stats"></div>
  <button class="clear-btn" onclick="clearAll()">🗑 Очистить все данные</button>
</div>

<script>
const CATS = [
  { emoji: '🍔', name: 'Еда', bg: '#fff7ed' },
  { emoji: '🚗', name: 'Транспорт', bg: '#eff6ff' },
  { emoji: '🛍', name: 'Покупки', bg: '#fdf4ff' },
  { emoji: '💊', name: 'Здоровье', bg: '#f0fdf4' },
  { emoji: '🎮', name: 'Развлечения', bg: '#fef9c3' },
  { emoji: '🏠', name: 'Жильё', bg: '#fff1f2' },
  { emoji: '📱', name: 'Связь', bg: '#e0f2fe' },
  { emoji: '✈️', name: 'Путешествия', bg: '#ecfdf5' },
  { emoji: '📚', name: 'Учёба', bg: '#f5f3ff' },
  { emoji: '❓', name: 'Другое', bg: '#f3f4f6' },
  { emoji: '🍺', name: 'Рестораны', bg: '#fefce8' },
  { emoji: '🎁', name: 'Подарки', bg: '#fff0f6' },
];

let selectedCat = null;
let expenses = JSON.parse(localStorage.getItem('tg_expenses') || '[]');

function save() {
  localStorage.setItem('tg_expenses', JSON.stringify(expenses));
}

function fmt(n) {
  return n.toLocaleString('ru-BY', { maximumFractionDigits: 2 }) + ' Br';
}

function today() {
  return new Date().toISOString().slice(0, 10);
}
function thisMonth() {
  return new Date().toISOString().slice(0, 7);
}

// Telegram Web App init
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// ── Вкладки ──────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['history', 'add', 'stats'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'stats') renderStats();
}

// ── Категории ─────────────────────────────────────────────
function buildCatGrid() {
  const grid = document.getElementById('cats-grid');
  grid.innerHTML = '';
  CATS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<span>${c.emoji}</span><span>${c.name}</span>`;
    btn.onclick = () => {
      selectedCat = i;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });
}

// ── Добавить расход ───────────────────────────────────────
function submitExpense() {
  const amountRaw = parseFloat(document.getElementById('amount-input').value);
  if (!amountRaw || amountRaw <= 0) {
    alert('Введи сумму!');
    return;
  }
  if (selectedCat === null) {
    alert('Выбери категорию!');
    return;
  }
  const note = document.getElementById('note-input').value.trim();
  const cat = CATS[selectedCat];
  expenses.push({
    id: Date.now(),
    amount: amountRaw,
    cat: cat.name,
    emoji: cat.emoji,
    note,
    date: new Date().toISOString()
  });
  save();
  updateHeader();

  document.getElementById('amount-input').value = '';
  document.getElementById('note-input').value = '';
  selectedCat = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));

  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.HapticFeedback && Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  }

  switchTab('history');
}

// ── История ───────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('expense-list');
  if (!expenses.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">💸</div><p>Расходов пока нет.<br>Нажми «Добавить»!</p></div>`;
    return;
  }
  const sorted = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));
  list.innerHTML = sorted.map(e => {
    const d = new Date(e.date);
    const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    return `
    <div class="expense-item">
      <div class="expense-icon" style="background:${CATS.find(c=>c.name===e.cat)?.bg||'#f3f4f6'}">
        ${e.emoji}
      </div>
      <div class="expense-info">
        <div class="expense-cat">${e.cat}${e.note ? ' · ' + e.note : ''}</div>
        <div class="expense-meta">${dateStr}, ${timeStr}</div>
      </div>
      <div class="expense-amount">${fmt(e.amount)}</div>
      <button class="delete-btn" onclick="deleteExpense(${e.id})">✕</button>
    </div>`;
  }).join('');
}

function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  save();
  updateHeader();
  renderHistory();
}

// ── Статистика ────────────────────────────────────────────
function renderStats() {
  const todayStr = today();
  const monthStr = thisMonth();

  const all = expenses;
  const todayExp = all.filter(e => e.date.startsWith(todayStr));
  const monthExp = all.filter(e => e.date.startsWith(monthStr));

  const sum = arr => arr.reduce((a, e) => a + e.amount, 0);

  document.getElementById('stat-month').textContent = fmt(sum(monthExp));
  document.getElementById('stat-month-count').textContent = monthExp.length + ' записей';
  document.getElementById('stat-today').textContent = fmt(sum(todayExp));
  document.getElementById('stat-today-count').textContent = todayExp.length + ' записей';
  document.getElementById('stat-total').textContent = fmt(sum(all));
  document.getElementById('stat-total-count').textContent = all.length + ' записей';
  document.getElementById('stat-avg').textContent = all.length ? fmt(Math.round(sum(all) / all.length)) : '0 ₽';

  const bycat = {};
  all.forEach(e => {
    bycat[e.cat] = bycat[e.cat] || { emoji: e.emoji, total: 0 };
    bycat[e.cat].total += e.amount;
  });
  const sorted = Object.entries(bycat).sort((a, b) => b[1].total - a[1].total);
  const maxAmt = sorted[0]?.[1].total || 1;

  document.getElementById('cat-stats').innerHTML = sorted.map(([cat, info]) => `
    <div class="cat-stat-item">
      <div class="cat-stat-row">
        <span style="font-size:20px">${info.emoji}</span>
        <span class="cat-stat-name">${cat}</span>
        <span class="cat-stat-amt">${fmt(info.total)}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${Math.round(info.total / maxAmt * 100)}%"></div>
      </div>
    </div>
  `).join('') || '<div class="empty"><div class="empty-icon">📊</div><p>Нет данных</p></div>';
}

// ── Шапка ─────────────────────────────────────────────────
function updateHeader() {
  const monthStr = thisMonth();
  const monthExp = expenses.filter(e => e.date.startsWith(monthStr));
  const total = monthExp.reduce((a, e) => a + e.amount, 0);
  document.getElementById('header-total').textContent = fmt(total);
  document.getElementById('header-sub').textContent = monthExp.length + ' записей в этом месяце';
}

// ── Очистить ──────────────────────────────────────────────
function clearAll() {
  if (confirm('Удалить все записи? Это действие нельзя отменить.')) {
    expenses = [];
    save();
    updateHeader();
    renderHistory();
  }
}

// ── Инициализация ─────────────────────────────────────────
buildCatGrid();
updateHeader();
renderHistory();
</script>
</body>
</html>
